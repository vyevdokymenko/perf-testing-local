jenkins:
  systemMessage: "Jenkins configured as code"
  numExecutors: 0
  
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USERNAME}"
          password: "${JENKINS_ADMIN_PASSWORD}"
          name: "Jenkins Admin"
        - id: "${JENKINS_AGENT_USERNAME}"
          password: "${JENKINS_AGENT_PASSWORD}"
          name: "JMeter Agent"
        - id: "${JENKINS_TESTER_USERNAME}"
          password: "${JENKINS_TESTER_PASSWORD}"
          name: "User Tester"
  
  projectNamingStrategy:
    roleBased:
      forceExistingJobs: true

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Full administrator"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "admin"
          - name: "agent"
            description: "Limited agent access"
            permissions:
              - "Overall/Read"
              - "Agent/Connect"
              - "Agent/Configure"
              - "Overall/RunScripts"
            entries:
              - user: "agent"
          - name: "authenticated"
            description: "All logged-in users read-only"
            permissions:
              - "Overall/Read"
            entries:
              - group: "authenticated"
        items:
          - name: "tester"
            description: "Can only manage own jobs"
            pattern: "aikom-.*"
            permissions:
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Configure"
              - "Job/Create"
              - "Job/Delete"
              - "Job/Discover"
              - "Job/Read"
            entries:
              - user: "tester"
  
  nodes:
    - permanent:
        name: "${JENKINS_AGENT_NAME}"
        remoteFS: "${JENKINS_AGENT_WORKSPACE}" 
        numExecutors: 5
        labelString: "${JENKINS_AGENT_LABEL}"
        mode: "NORMAL"
        launcher:
          inbound:
            tunnel: ""
            webSocket: true
            workDirSettings:
              disabled: false
              internalDir: "remoting"
              failIfWorkDirIsMissing: false

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              id: "github-ssh-key"
              description: "SSH key for GitHub access"
              username: "git"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/tmp/github_ssh_key}"

jobs:
  - script: >
      freeStyleJob('seed-job-pipeline-generator') {
          description('Parent job: scans the repository and automatically generates pipelines for each .jenkinsfile')
      
          scm {
              git {
                  remote {
                      url('git@github.com:vyevdokymenko/perf-testing-local.git')
                      credentials('github-ssh-key')
                  }
                  branches('main')
              }
          }
      
          steps {
              jobDsl {
                  targets('seedjob.groovy')
      
                  // MAGIC: If you delete a file from Git, Jenkins will automatically delete the job!
                  removedJobAction('DELETE')
                  removedViewAction('DELETE')
              }
          }
      
          triggers {
              scm('H/15 * * * *')
          }
      }

unclassified:  
  location:
    url: "${JENKINS_EXTERNAL_URL}"
    adminAddress: "${JENKINS_ADMIN_MAIL}"